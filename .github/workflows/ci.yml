name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # --retry cubre los cortes de red del runner, que son frecuentes y
          # no dicen nada sobre el codigo. Sin esto, un fallo transitorio deja
          # el pipeline en rojo y acabas ignorando los rojos.
          curl -sSL --retry 5 --retry-delay 3 --retry-all-errors --fail \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan the repository history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: deploy
    # Solo despues de que los dos jobs anteriores esten en verde, y solo en main.
    needs: [secrets, build]
    # workflow_dispatch incluido a proposito: permite republicar a mano cuando
    # cambia una variable de entorno de Vercel, que no genera ningun commit.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://financetracker-web-tau.vercel.app

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      # Enlazar por nombre evita depender de identificadores copiados a mano.
      - name: Link the Vercel project
        run: vercel link --yes --project financetracker-web --token=$VERCEL_TOKEN

      - name: Pull the production configuration
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
