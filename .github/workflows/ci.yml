name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permisos minimos por defecto para el GITHUB_TOKEN: solo lectura del
# codigo. Un job que necesite mas lo declara el mismo, solo para el.
permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # --retry cubre los cortes de red del runner, que son frecuentes y
          # no dicen nada sobre el codigo. Sin esto, un fallo transitorio deja
          # el pipeline en rojo y acabas ignorando los rojos.
          curl -sSL --retry 5 --retry-delay 3 --retry-all-errors --fail \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          # Integridad del binario: el SHA-256 esta escrito aqui (sacado del
          # checksums.txt oficial de la release), no se descarga junto al
          # binario. Si alguien manipulara la release, el hash no cuadraria
          # y el job fallaria antes de ejecutar nada. Al subir de version de
          # gitleaks hay que actualizar la URL y este hash a la vez.
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan the repository history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Falla si alguna dependencia (tambien las transitivas) tiene una
      # vulnerabilidad conocida de gravedad alta o critica. --omit=dev deja
      # fuera las herramientas de desarrollo, que no llegan al navegador.
      - name: Vulnerable packages
        run: npm audit --omit=dev --audit-level=high

      # Tests con cobertura: falla si baja del minimo de vitest.config.mts.
      - name: Test
        run: npm run test:coverage

      # El % de cobertura en el resumen del job, tambien si los tests fallan.
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (name, m) => `| ${name} | ${m.pct} % | ${m.covered} / ${m.total} |`;
            console.log(["### Cobertura de tests", "", "| | % | Cubiertas |", "|---|---|---|",
              row("Lineas", t.lines), row("Ramas", t.branches), row("Funciones", t.functions)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

  deploy:
    name: deploy
    # Solo despues de que los dos jobs anteriores esten en verde, y solo en main.
    needs: [secrets, build]
    # workflow_dispatch incluido a proposito: permite republicar a mano cuando
    # cambia una variable de entorno de Vercel, que no genera ningun commit.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Un solo despliegue a produccion a la vez. Si llegan dos pushes seguidos,
    # el segundo espera a que termine el primero (no lo cancela: cortar un
    # despliegue a medias podria dejar la web en un estado inconsistente).
    concurrency:
      group: production
      cancel-in-progress: false

    environment:
      name: production
      url: https://financetracker-web-tau.vercel.app

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Version fijada: esta herramienta maneja VERCEL_TOKEN, asi que no se
      # instala "lo ultimo que haya hoy". Se actualiza a mano, revisando el
      # changelog, cambiando VERCEL_CLI_VERSION.
      - name: Install the Vercel CLI
        env:
          VERCEL_CLI_VERSION: 65.15.0
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # Enlazar por nombre evita depender de identificadores copiados a mano.
      - name: Link the Vercel project
        run: vercel link --yes --project financetracker-web --token=$VERCEL_TOKEN

      - name: Pull the production configuration
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      # Smoke test: comprueba que la web publicada responde con un 2xx. Si
      # no, el job falla y toca hacer rollback (Instant Rollback en Vercel o
      # "vercel rollback"). Los reintentos cubren los segundos que tarda el
      # dominio en apuntar al despliegue nuevo.
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output /dev/null --write-out "HTTP %{http_code}\n" \
            https://financetracker-web-tau.vercel.app

  # DAST: analiza la web ya desplegada desde fuera, como haria un atacante,
  # con OWASP ZAP en modo baseline (pasivo, no destructivo): cabeceras de
  # seguridad que faltan (CSP, HSTS...), cookies inseguras, informacion
  # expuesta... Recorre las paginas reales de la web, no solo la portada.
  #  - fail_action: true: cualquier alerta nueva pone el pipeline en rojo. Los
  #    riesgos aceptados estan en .zap/rules.tsv como INFO (salen en el
  #    informe pero no fallan), cada uno con su motivo.
  #  - allow_issue_writing: false porque el repo es publico: el informe NO se
  #    publica como issue (seria una lista de debilidades a la vista de todos),
  #    solo como artefacto de la ejecucion (zap-report).
  dast:
    name: dast
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://financetracker-web-tau.vercel.app
          # Las reglas se pasan con -c a mano: la action solo usa rules_file_name
          # si el archivo tiene alguna regla IGNORE, y aqui todas son INFO.
          cmd_options: '-c .zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report
