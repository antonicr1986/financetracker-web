name: Mirror to Azure DevOps

on:
  push:
    # Las ramas de Dependabot no se espejan: sus ejecuciones no tienen acceso
    # a los secrets de Actions (el PAT llega vacio y el push falla). Cuando su
    # PR se fusiona a main, el mirror de main ya lleva el cambio a Azure.
    branches-ignore: [ 'dependabot/**' ]
    tags: [ '**' ]
  delete:
  workflow_dispatch:

# Permisos minimos por defecto para el GITHUB_TOKEN: solo lectura del
# codigo. Un job que necesite mas lo declara el mismo, solo para el.
permissions:
  contents: read

jobs:
  mirror:
    # Segunda proteccion: cubre tambien el evento delete (cuando Dependabot
    # borra su rama al fusionar o cerrar el PR), que no admite filtros de rama.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar repo completo (todas las ramas y tags)
        run: git clone --bare "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo.git

      - name: Push espejo a Azure Repos
        working-directory: repo.git
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: git push --mirror "https://antonicr1986:${AZURE_PAT}@dev.azure.com/antonicr1986/FinanceTracker/_git/financetracker-web"